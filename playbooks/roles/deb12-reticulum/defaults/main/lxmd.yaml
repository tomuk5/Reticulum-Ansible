---

reticulum_lxmd_enabled: false
reticulum_lxmd_config_path: "/etc/lxmd"
reticulum_lxmd_propagation_enabled: false
reticulum_lxmd_propagation_announce_interval: 360
reticulum_lxmd_propagation_announce_at_start: true
reticulum_lxmd_propagation_autopeer: true
reticulum_lxmd_propagation_autopeer_maxdepth: 4
reticulum_lxmd_propagation_transfer_max_accepted_size: 256
reticulum_lxmd_propagation_auth_required: false
reticulum_lxmd_propagation_message_storage_limit: 2000

reticulum_lxmd_lxmf_display_name: "Anonymous Peer"
reticulum_lxmd_lxmf_announce_at_start: false
reticulum_lxmd_lxmf_announce_interval_enabled: false
reticulum_lxmd_lxmf_announce_interval_minutes: 360
reticulum_lxmd_lxmf_delivery_transfer_max_accepted_size: 1000
reticulum_lxmd_lxmf_on_inbound_enabled: false
reticulum_lxmd_lxmf_on_inbound_command: "rm"
reticulum_lxmd_logging_loglevel: 4