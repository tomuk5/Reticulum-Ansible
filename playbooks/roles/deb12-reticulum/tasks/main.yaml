---

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install dependancies
  ansible.builtin.apt:
    pkg:
      - pip
      - python3
      - python3-cryptography
      - python3-serial
      - python3-nacl
  notify:
    - Apt-get clean
    - Apt-get autoclean
  when: reticulum_rnsd_enabled is true or reticulum_lxmd_enabled is true or reticulum_nomadnet_enabled is true

- name: Install RNSD
  ansible.builtin.include_tasks:
    file: rnsd.yaml
    apply:
      tags:
        - reticulum/rnsd
  when: reticulum_rnsd_enabled is true

- name: Install LXMD
  ansible.builtin.include_tasks:
    file: lxmd.yaml
    apply:
      tags:
        - reticulum/lxmd
  when: reticulum_rnsd_enabled is true and reticulum_lxmd_enabled is true

- name: Install NomadNet
  ansible.builtin.include_tasks:
    file: nomadnet.yaml
    apply:
      tags:
        - reticulum/nomadnet
  when: reticulum_rnsd_enabled is true and reticulum_nomadnet_enabled is true

- name: Update NomadNet Page content
  ansible.builtin.copy:
    src: "storage/pages/"
    dest: "/etc/nomadnetwork/storage/pages/"
    owner: "{{ reticulum_rnsd_service_user }}"
    group: "{{ reticulum_rnsd_service_user }}"
    mode: '0755'
  tags: reticulum/nomadnetcontent
  when: reticulum_rnsd_enabled is true and reticulum_nomadnet_enabled is true
  notify: Restart nomadnet
